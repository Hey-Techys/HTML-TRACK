<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example — Accessible Login Form</title>
</head>
<body>
  <!--
    This is a worked example showing the standard expected for Block 2
    (forms/accessibility/SEO) issues. aria-describedby links the password input to its visible hint text for screen readers.
  -->
  <main>
    <h1>Log In</h1>
    <form action="/login" method="POST">
      <div>
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" required>
      </div>
      <div>
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" required minlength="8" aria-describedby="password-hint">
        <p id="password-hint">Must be at least 8 characters.</p>
      </div>
      <button type="submit">Log In</button>
    </form>
  </main>
</body>
</html>
