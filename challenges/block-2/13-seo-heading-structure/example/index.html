<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Beginner's Guide to Accessible Forms</title>
  <meta name="description" content="A practical guide to writing accessible HTML forms, covering labels, fieldsets, and ARIA basics for beginners.">
</head>
<body>
  <!--
    This is a worked example showing the standard expected for Block 2
    (forms/accessibility/SEO) issues. Single h1, no skipped heading levels, full meta tag set in the head.
  -->
  <main>
    <h1>A Beginner's Guide to Accessible Forms</h1>
    <section>
      <h2>Why Accessibility Matters</h2>
      <p>Accessible forms let every user, including those using screen readers, complete tasks independently.</p>
    </section>
    <section>
      <h2>Labeling Inputs</h2>
      <h3>Using the for/id Pair</h3>
      <p>Every input needs a label connected through matching `for` and `id` attributes.</p>
    </section>
  </main>
</body>
</html>
