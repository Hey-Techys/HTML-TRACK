<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="'This is a simple booking form" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <form action="#" method="post">
        <label for="fullname">Full Name</label>
        <input
          type="text"
          name="fullname"
          id="fullname"
          required
        />
        <br />
        <label for="phone">Phone</label>
        <input
          type="tel"
          name="phone"
          id="phone"
          aria-describedby="phone-error"
          required
        />
        <br />
        <label for="email">Email</label>
        <input
          type="email"
          name="email"
          id="email"
          required
        />
        <br />
        <label for="arrival-date">Arrival Date</label>
        <input
          type="date"
          name="arrival-date"
          id="arrival-date"
          required
        />
        <br />
        <label for="return-date">Return Date</label>
        <input
          type="date"
          name="return-date"
          id="return-date"
          required
        />
        <br />
        <button type="submit">Submit Booking Details</button>
      </form>
      <p id="display-booking-status" aria-live="polite">
        <!-- dynamically inject text to display a text to the user after submission -->
      </p>
    </main>
  </body>
</html>
