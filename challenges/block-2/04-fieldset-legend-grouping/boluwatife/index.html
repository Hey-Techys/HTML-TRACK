<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fieldset and Legend Grouping</title>
  </head>
  <body>
    <main>
      <h1>Contact Preferences</h1>
      <form action="#" method="post">
        <fieldset>
          <legend>Preferred Contact Method</legend>
          <input
            type="radio"
            name="contact-method"
            id="contact-email"
            value="email"
          />
          <label for="contact-email">Email</label>
          <input
            type="radio"
            name="contact-method"
            id="contact-phone"
            value="phone"
          />
          <label for="contact-phone">Phone</label>
          <input
            type="radio"
            name="contact-method"
            id="contact-text"
            value="text"
          />
          <label for="contact-text">Text</label>
        </fieldset>
        <button type="submit">Save Preference</button>
      </form>
    </main>
  </body>
</html>
