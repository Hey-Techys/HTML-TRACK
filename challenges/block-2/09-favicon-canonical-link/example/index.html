<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example — Favicon & Canonical Link</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="canonical" href="https://example.com/about">
</head>
<body>
  <!--
    This is a worked example showing the standard expected for Block 2
    (forms/accessibility/SEO) issues. Favicon tag plus a canonical URL declaration in the head.
  -->
  <main>
    <h1>About This Site</h1>
    <p>This page demonstrates a favicon and a canonical link tag.</p>
  </main>
</body>
</html>
