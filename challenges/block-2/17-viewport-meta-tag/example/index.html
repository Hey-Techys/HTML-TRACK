<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example — Viewport Meta Tag</title>
</head>
<body>
  <!--
    This is a worked example showing the standard expected for Block 2
    (forms/accessibility/SEO) issues. The viewport meta tag tells mobile browsers to use the device width instead of a zoomed-out desktop width. Zooming is left enabled for accessibility.
  -->
  <main>
    <h1>My Mobile-Friendly Page</h1>
    <p>Open your browser's device toolbar and switch to a phone size. With the viewport meta tag, this text stays readable instead of shrinking to a tiny desktop layout.</p>
  </main>
</body>
</html>
