<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Section Signup Form</title>
  </head>
  <body>
    <main>
      <h1>Create your account</h1>
      <form action="#" method="post">
        <fieldset>
          <legend>Personal Information</legend>
          <div>
            <label for="fname">Full Name</label>
            <input
              type="text"
              id="fname"
              name="full-name"
              required
              aria-required="true"
            />
          </div>
          <div>
            <label for="mail">Email Address</label>
            <input
              type="email"
              id="mail"
              name="email-address"
              required
              aria-required="true"
            />
          </div>
        </fieldset>

        <fieldset>
          <legend>Account Information</legend>
          <div>
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              required
              aria-required="true"
              aria-describedby="username-hint"
            />
            <p id="username-hint">
              Choose a unique username with 3-20 characters.
            </p>
          </div>
          <div>
            <label for="signup-password">Password</label>
            <input
              type="password"
              id="signup=password"
              name="password"
              minlength="8"
              maxlength="15"
              required
              aria-required="true"
              aria-describedby="password-hint"
            />
            <p id="password-hint">
              Must be at least 8 characters and not more than 20 characters.
            </p>
          </div>
        </fieldset>
        <button type="submit">Create Account</button>
      </form>
    </main>
  </body>
</html>
