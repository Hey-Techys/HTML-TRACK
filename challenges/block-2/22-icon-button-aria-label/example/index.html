<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example — Icon-Only Links With ARIA Labels</title>
</head>
<body>
  <!--
    This is a worked example showing the standard expected for Block 2
    (forms/accessibility/SEO) issues. Decorative icon alt="" paired with a descriptive aria-label on the link itself.
  -->
  <main>
    <h1>Find Me Online</h1>
    <nav aria-label="Social media links">
      <a href="https://github.com/example" aria-label="Visit my GitHub profile">
        <img src="github-icon.svg" alt="">
      </a>
      <a href="https://linkedin.com/in/example" aria-label="Visit my LinkedIn profile">
        <img src="linkedin-icon.svg" alt="">
      </a>
      <a href="https://twitter.com/example" aria-label="Visit my Twitter profile">
        <img src="twitter-icon.svg" alt="">
      </a>
    </nav>
  </main>
</body>
</html>
