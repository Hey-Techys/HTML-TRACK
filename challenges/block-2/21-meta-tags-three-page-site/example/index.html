<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example — Home — Consistent Meta Tags</title>
  <meta name="description" content="Ada Codes — a junior web developer sharing HTML projects, notes and ways to get in touch.">
  <link rel="icon" href="/favicon.ico">
  <link rel="canonical" href="https://example.com/">
  <meta property="og:title" content="Ada Codes — Home">
  <meta property="og:description" content="HTML projects, notes and ways to get in touch.">
  <meta property="og:url" content="https://example.com/">
</head>
<body>
  <!--
    This is a worked example showing the standard expected for Block 2
    (forms/accessibility/SEO) issues. This is the Home page of a 3-page site. About and Contact use the same base tags, but their own title, description, canonical and og:* values.
  -->
  <main>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <h1>Welcome to Ada Codes</h1>
    <p>Projects and notes from my HTML journey.</p>
  </main>
</body>
</html>
