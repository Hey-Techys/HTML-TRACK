<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example — Multi-Field Signup Form</title>
</head>
<body>
  <!--
    This is a worked example showing the standard expected for Block 2
    (forms/accessibility/SEO) issues. Each field uses the input type that matches its data, so browsers show the right keyboard/picker and validate natively.
  -->
  <main>
    <h1>Create Your Account</h1>
    <form action="/signup" method="POST">
      <div>
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" name="email" required>
      </div>
      <div>
        <label for="signup-dob">Date of birth</label>
        <input type="date" id="signup-dob" name="dob" max="2012-12-31" required>
      </div>
      <div>
        <label for="signup-experience">Years of coding experience</label>
        <input type="number" id="signup-experience" name="experience" min="0" max="50" step="1" required>
      </div>
      <button type="submit">Sign Up</button>
    </form>
  </main>
</body>
</html>
