<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic 'Contact Us' Form</title>
</head>

<body>
    <main>

        <h1>Contact Us</h1>
        <br>
        <div id="name">
            <label for="name">Full Name</label>
            <input type="text" name="name">
        </div>
        <br>
        <div id="email">
            <label for="email">Email Address</label>
            <input type="email" name="email">
        </div>
        <br>
        <div id="Message">
            <label for="name">Complaint</label>
            <textarea name="complaint" id="complaint">Write your message here</textarea>
        </div>
    </main>
</body>

</html>
