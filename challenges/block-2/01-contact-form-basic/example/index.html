<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example — Basic Contact Form</title>
</head>
<body>
  <!--
    This is a worked example showing the standard expected for Block 2
    (forms/accessibility/SEO) issues. This is a worked example showing the standard expected for Block 2
    (forms/accessibility) issues. Every input has a matching label.
  -->
  <main>
    <h1>Contact Me</h1>
    <form action="/submit" method="POST">
      <div>
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name">
      </div>
      <div>
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email">
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message"></textarea>
      </div>
      <button type="submit">Send Message</button>
    </form>
  </main>
</body>
</html>
