<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Pattern Validation</title>
</head>
<body>
    <main>
        <form action="#" method="post">
            <label for="phone">Phone Number</label>
            <input type="tel" name="phone" id="phone" pattern="[0-9]{3}-[0-9]{4}-[0-9]{4}" placeholder="080-1234-5678" required>
            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
